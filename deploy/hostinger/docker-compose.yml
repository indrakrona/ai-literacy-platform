# AI Literacy platform for Hostinger's Docker manager (hPanel → VPS → Docker manager, or the Hostinger API),
# on a VPS made from the "Ubuntu 24.04 with Docker and Traefik" template. The template's Traefik receives
# HTTPS for DOMAIN and passes it to the app; nothing else is exposed. Values come from the project
# environment (see env.example next to this file). Guide: deploy/hostinger/README.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *logging
    # Public image built by the Release workflow on every push to main; "Update" in the Docker manager pulls it.
    image: ghcr.io/indrakrona/ailit-web:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URI: postgres://ailit:${DB_PASSWORD}@db:5432/ailit
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN}
      SERVER_URL: https://${DOMAIN}
      MEDIA_DIR: /app/media
      CRON_SECRET: ${CRON_SECRET}
      OPS_SECRET: ${OPS_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ailearning.impact.id}
      # Until SMTP is set, write emails (sign-in codes, reset links) to the app log. Set false for real students.
      EMAIL_TO_LOG: ${EMAIL_TO_LOG:-true}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET}
      PAYMENTS_ALLOW_MOCK: ${PAYMENTS_ALLOW_MOCK:-true}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TZ: Asia/Jakarta
    volumes:
      - media-data:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.ailit.rule: Host(`${DOMAIN}`)
      traefik.http.routers.ailit.entrypoints: websecure
      traefik.http.routers.ailit.tls.certresolver: letsencrypt
      traefik.http.services.ailit.loadbalancer.server.port: "8080"

  db:
    logging: *logging
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ailit
      TZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Gives the uploads volume to the app user (uid 999) before the app starts. Reuses the Postgres image.
  media-init:
    logging: *logging
    image: postgres:16
    restart: "no"
    entrypoint: ["sh", "-c", "chown 999:999 /media"]
    volumes:
      - media-data:/media

  # Nightly database dump and media archive into backups/ next to this file, kept for BACKUP_KEEP_DAYS.
  backup:
    logging: *logging
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Jakarta
    volumes:
      - ./backups:/backups
      - media-data:/media:ro
    entrypoint: >
      sh -c "while true; do
               pg_dump -h db -U ailit -Fc ailit > /backups/ailit-$$(date +%F).dump;
               tar -czf /backups/media-$$(date +%F).tgz -C /media .;
               find /backups -name 'ailit-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete;
               find /backups -name 'media-*.tgz' -mtime +$${BACKUP_KEEP_DAYS} -delete;
               sleep 86400; done"

  # Hourly jobs: test reminders, the Sunday parent summary and scheduled announcements.
  scheduler:
    logging: *logging
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: >
      sh -c "sleep 60; while true; do
               curl -fsS -X POST -H \"x-cron-secret: $${CRON_SECRET}\" http://web:8080/api/jobs/run || echo 'jobs run failed';
               sleep 3600; done"

volumes:
  db-data:
  media-data:
