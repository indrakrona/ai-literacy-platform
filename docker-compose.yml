# Local development database. Production uses managed PostgreSQL in the Jakarta region.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ailit
      POSTGRES_PASSWORD: ailit
      POSTGRES_DB: ailit_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
