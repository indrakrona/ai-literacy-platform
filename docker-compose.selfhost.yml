# Run the whole platform on one server (testing / pilot) before moving to Google Cloud.
# Full guide: docs/hosting.md. In short:
#   scripts/selfhost-setup.sh ailearning.impact.id you@impact.id     # writes .env.selfhost with random secrets
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost --profile https up -d --build
# Profiles: "https" adds Caddy with automatic HTTPS on ports 80/443 (leave it out if you already run
# Nginx or a Cloudflare Tunnel in front of port 8080); "tools" is the one-off seed / create-admin container.
x-app-env: &app-env
  DATABASE_URI: postgres://ailit:${DB_PASSWORD}@db:5432/ailit
  PAYLOAD_SECRET: ${PAYLOAD_SECRET}
  NEXT_PUBLIC_SERVER_URL: ${PUBLIC_URL}
  S3_BUCKET: ailit-media
  S3_REGION: us-east-1
  S3_ENDPOINT: http://storage:9000
  S3_ACCESS_KEY_ID: ${STORAGE_USER}
  S3_SECRET_ACCESS_KEY: ${STORAGE_PASSWORD}
  TZ: Asia/Jakarta

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: run
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    # Only reachable from the server itself by default; the proxy (Caddy, Nginx, tunnel) is the public door.
    # Set WEB_BIND=0.0.0.0:8080 only if the proxy runs on another machine.
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    environment:
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ailearning.impact.id}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-}
      PAYMENTS_ALLOW_MOCK: ${PAYMENTS_ALLOW_MOCK:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  # Automatic HTTPS for DOMAIN (profile "https").
  caddy:
    image: caddy:2.8.4
    profiles: [https]
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-ailearning.impact.id}
      ACME_EMAIL: ${ACME_EMAIL:-indra@impact.id}
    volumes:
      - ./infra/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # One-off tasks: docker compose ... --profile tools run --rm tools seed | create-admin | migrate
  tools:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tools
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      NODE_ENV: production
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ailit
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for media; replaced by Google Cloud Storage on migration.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    volumes:
      - storage-data:/data

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [storage]
    entrypoint: >
      sh -c "until mc alias set local http://storage:9000 $${STORAGE_USER} $${STORAGE_PASSWORD}; do sleep 2; done;
             mc mb --ignore-existing local/ailit-media"
    environment:
      STORAGE_USER: ${STORAGE_USER}
      STORAGE_PASSWORD: ${STORAGE_PASSWORD}

  # Nightly database backup into ./backups, kept for BACKUP_KEEP_DAYS. Copy them off the server too
  # (docs/backup.md): a backup on the same disk does not survive losing the server.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
               pg_dump -h db -U ailit -Fc ailit > /backups/ailit-$$(date +%F).dump;
               find /backups -name 'ailit-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete;
               sleep 86400; done"

  # Hourly jobs: test reminders, the Sunday parent summary and scheduled announcements.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: >
      sh -c "sleep 60; while true; do
               curl -fsS -X POST -H \"x-cron-secret: $${CRON_SECRET}\" http://web:8080/api/jobs/run || echo 'jobs run failed';
               sleep 3600; done"

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
