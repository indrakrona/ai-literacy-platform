# Run the whole platform on one server (testing / pilot) before moving to Google Cloud.
#   cp .env.selfhost.example .env.selfhost   # fill in secrets
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build
# Put a reverse proxy with HTTPS (Caddy, Nginx, Cloudflare Tunnel) in front of port 8080 for ailearning.impact.id.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DATABASE_URI: postgres://ailit:${DB_PASSWORD}@db:5432/ailit
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_URL}
      S3_BUCKET: ailit-media
      S3_REGION: us-east-1
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: ${STORAGE_USER}
      S3_SECRET_ACCESS_KEY: ${STORAGE_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET:-}
      PAYMENTS_ALLOW_MOCK: ${PAYMENTS_ALLOW_MOCK:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ailit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ailit
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailit"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for media; replaced by Google Cloud Storage on migration.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    volumes:
      - storage-data:/data

  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [storage]
    entrypoint: >
      sh -c "until mc alias set local http://storage:9000 $${STORAGE_USER} $${STORAGE_PASSWORD}; do sleep 2; done;
             mc mb --ignore-existing local/ailit-media"
    environment:
      STORAGE_USER: ${STORAGE_USER}
      STORAGE_PASSWORD: ${STORAGE_PASSWORD}

  # Nightly database backup into ./backups (prune old dumps on the host as needed).
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
               pg_dump -h db -U ailit -Fc ailit > /backups/ailit-$$(date +%F).dump;
               sleep 86400; done"

volumes:
  db-data:
  storage-data:
